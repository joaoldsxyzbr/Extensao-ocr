<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 280px; margin: 0; padding: 12px; background: #17181d; color: #e8e8ea; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .contagem { font-size: 12px; color: #a0a3ad; margin-bottom: 10px; }
    button {
      display: block; width: 100%; box-sizing: border-box; margin-bottom: 8px;
      padding: 8px; border: 0; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .primario { background: #2563eb; color: #fff; font-weight: 600; }
    .secundario { background: #2a2c33; color: #e8e8ea; }
    .perigo { background: #7f1d1d; color: #fca5a5; }
    .vazio { font-size: 12px; color: #6b6e78; padding: 6px 0; }
  </style>
</head>
<body>
  <h1>📦 Extrator de Produtos</h1>
  <div class="contagem" id="contagem"></div>
  <button class="primario" id="abrir">Abrir extrator</button>
  <button class="secundario" id="copiar">Copiar lista salva</button>
  <button class="perigo" id="limpar">Limpar lista salva</button>
  <script src="popup.js"></script>
</body>
</html>
