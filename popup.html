<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 360px; margin: 0; padding: 12px; background: #17181d; color: #e8e8ea; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .zona {
      border: 2px dashed #3f424c; border-radius: 12px; padding: 18px 12px;
      text-align: center; cursor: pointer; background: #1d1f25; margin-bottom: 8px;
      transition: all .15s; font-size: 13px;
    }
    .zona:hover { border-color: #2563eb; }
    .zona .icone { font-size: 26px; }
    .zona .dica { color: #7c808b; font-size: 11px; display: block; margin-top: 4px; }
    .miniaturas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .miniaturas img { height: 48px; border-radius: 6px; border: 1px solid #3f424c; }
    .contagem { font-size: 11px; color: #a0a3ad; margin-bottom: 8px; }
    .status { background: #1e3a8a; border-radius: 8px; padding: 7px 10px; font-size: 12px; margin-bottom: 8px; }
    .status.ok { background: #064e3b; }
    .item { display: flex; gap: 5px; align-items: center; margin-bottom: 5px; }
    .item input[type="checkbox"] { flex: 0; }
    .item input {
      background: #23252c; color: #e8e8ea; border: 1px solid #3f424c; border-radius: 6px;
      padding: 5px 6px; font-size: 11px; font-family: ui-monospace, Consolas, monospace; min-width: 0;
    }
    .item .codigo { width: 60px; flex: 0 0 60px; }
    .item .descricao { flex: 1; }
    .item button { padding: 3px 6px; font-size: 11px; }
    .vazio { color: #6b6e78; font-size: 12px; }
    button {
      border: 0; border-radius: 8px; padding: 7px 10px; cursor: pointer;
      font-size: 12px; color: #e8e8ea; background: #2a2c33;
    }
    .acoes { display: flex; gap: 6px; margin-top: 10px; }
    .acoes button { flex: 1; }
    button.primario { background: #2563eb; color: #fff; font-weight: 600; }
    button.colar { display: block; width: 100%; margin-bottom: 8px; padding: 9px 10px; font-size: 13px; background: #2563eb; color: #fff; font-weight: 600; }
    button.abrir { display: block; width: 100%; margin-top: 8px; background: #1d1f25; color: #7c808b; }
    .oculto { display: none; }
  </style>
</head>
<body>
  <h1>📦 Extrator de Produtos <span style="font-size:10px;color:#6ee7b7">OCR local</span></h1>

  <div class="zona" id="zona">
    <span class="icone">🖼️</span>
    <strong>Cole o print aqui (Ctrl+V)</strong>
    <span class="dica">ou clique para escolher um arquivo da pasta</span>
  </div>
  <input type="file" id="arquivos" accept="image/*" multiple hidden />

  <button class="colar" id="colar">📋 Colar print da área de transferência</button>

  <div class="miniaturas" id="miniaturas"></div>
  <div class="status oculto" id="status"></div>
  <div class="contagem" id="contagem"></div>
  <div id="resultados"></div>

  <div class="acoes">
    <button class="primario" id="copiar">Copiar</button>
    <button id="salvar">Salvar na lista</button>
    <button id="limpar">Limpar</button>
  </div>
  <button class="abrir" id="abrir">Abrir extrator completo ↗</button>

  <script src="vendor/tesseract.min.js"></script>
  <script src="parser.js"></script>
  <script src="ocr-comum.js"></script>
  <script src="popup.js"></script>
</body>
</html>
